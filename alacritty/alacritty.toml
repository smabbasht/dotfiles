[window]
padding.x = 10
padding.y = 10
dynamic_padding = true
opacity = 0.95
decorations = "none"

[scrolling]
history = 10000
multiplier = 3

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#202020"
foreground = "#fff4d2"

[colors.cursor]
text = "#bdae93"
cursor = "#665c54"

[selection]
save_to_clipboard = true

[colors.normal]
black = "#1d2021"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#a89984"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#fff4d2"

[font]
size = 10
[font.normal]
family = "ComicShannsMono Nerd Font"
style = "Regular"
[font.bold]
family = "ComicShannsMono Nerd Font"
style = "ExtraBold"
[font.italic]
family = "ComicShannsMono Nerd Font"
style = "Italic"
[font.bold_italic]
family = "ComicShannsMono Nerd Font"
style = "Bold Italic"
