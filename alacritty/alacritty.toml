[selection]
save_to_clipboard = true

[font]
size = 12.5

[font.normal]
family = "ComicShannsMono Nerd Font"
style = "Regular"

[font.bold]
family = "ComicShannsMono Nerd Font"
style = "ExtraBold"

[font.italic]
family = "ComicShannsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "ComicShannsMono Nerd Font"
style = "Bold Italic"
